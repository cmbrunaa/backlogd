<!DOCTYPE html>
<html class="dark" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Backlogd</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <style>

        body {
            font-family: 'Montserrat', sans-serif;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-glow-primary:hover {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

    </style>

</head>

<body class="bg-[#0b1326] text-white min-h-screen">

<header class="bg-black/40 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">

    <nav class="flex justify-between items-center px-8 py-4">

        <a href="{% url 'home' %}"
           class="text-3xl font-black text-cyan-400">
            Backlogd
        </a>

        <div class="flex items-center gap-4">

            {% if user.is_authenticated %}

                <span class="text-gray-300">
                    Olá, {{ user.username }}
                </span>

                <a href="{% url 'buscar' %}"
                   class="bg-purple-500 hover:bg-purple-400 transition px-5 py-2 rounded-full font-bold">
                    Buscar jogo
                </a>

                <a href="{% url 'logout' %}"
                   class="bg-white/10 hover:bg-white/20 transition px-5 py-2 rounded-full font-bold">
                    Sair
                </a>

            {% else %}

                <a href="{% url 'login' %}"
                   class="bg-purple-500 hover:bg-purple-400 transition px-5 py-2 rounded-full font-bold">
                    Entrar
                </a>

                <a href="{% url 'cadastro' %}"
                   class="bg-cyan-500 hover:bg-cyan-400 text-black transition px-5 py-2 rounded-full font-bold">
                    Criar conta
                </a>

            {% endif %}

        </div>

    </nav>

</header>

{% block content %}
{% endblock %}

</body>
</html>
