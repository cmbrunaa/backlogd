{% extends 'base.html' %}

{% block content %}

<main class="max-w-2xl mx-auto px-8 py-20">

    <section class="glass-card rounded-2xl p-10 text-center">

        <div class="w-24 h-24 mx-auto rounded-full bg-red-500/20 flex items-center justify-center mb-8">
            <span class="material-symbols-outlined text-red-400 text-5xl">
                delete
            </span>
        </div>

        <h1 class="text-5xl font-black text-white mb-6">
            Excluir jogo
        </h1>

        <p class="text-gray-300 text-lg leading-8 mb-10">
            Tem certeza que deseja excluir
            <span class="text-cyan-400 font-bold">
                "{{ game.nome }}"
            </span>
            do seu backlog?
        </p>

        {% if game.imagem_url %}
            <img
                src="{{ game.imagem_url }}"
                alt="{{ game.nome }}"
                class="w-48 h-64 object-cover rounded-xl mx-auto mb-10 shadow-2xl"
            >
        {% endif %}

        <form method="POST" class="flex justify-center gap-4">

            {% csrf_token %}

            <button
                type="submit"
                class="bg-red-500 hover:bg-red-400 text-white px-8 py-3 rounded-xl font-bold transition"
            >
                Sim, excluir
            </button>

            <a
                href="{% url 'home' %}"
                class="bg-white/10 hover:bg-white/20 text-white px-8 py-3 rounded-xl font-bold transition"
            >
                Cancelar
            </a>

        </form>

    </section>

</main>

{% endblock %}
